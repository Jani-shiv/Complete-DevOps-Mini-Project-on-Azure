# =============================================================================
# GITHUB ACTIONS CI/CD PIPELINE
# =============================================================================
# Purpose: Automatically build, test, and deploy Flask app to Azure VM
# Trigger: Push to main branch
# Deployment: SSH into Azure VM, pull latest code, rebuild Docker container
# =============================================================================

name: CI/CD Pipeline - Build and Deploy to Azure VM

# When should this workflow run?
on:
  push:
    branches:
      - main    # Only trigger on pushes to main branch
  pull_request:
    branches:
      - main    # Also run on PRs to main (for testing)
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Environment variables used across all jobs
env:
  DOCKER_IMAGE_NAME: devops-flask-app
  CONTAINER_NAME: flask-app-container
  APP_PORT: 5000

jobs:
  # ==========================================================================
  # JOB 1: BUILD AND TEST
  # ==========================================================================
  build-and-test:
    name: 🔨 Build and Test Application
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code from repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'app/requirements.txt'

      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest flake8

      # Step 4: Lint code with flake8
      - name: 🔍 Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Test if app can start (basic smoke test)
      - name: 🧪 Run Smoke Test
        run: |
          cd app
          python -c "from app import app; print('✅ App imports successfully')"

      # Step 6: Build Docker image to verify Dockerfile
      - name: 🐳 Build Docker Image
        run: |
          cd app
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .
          echo "✅ Docker image built successfully"

      # Step 7: Test Docker container runs correctly
      - name: 🧪 Test Docker Container
        run: |
          # Run container in background
          docker run -d --name test-container -p 5000:5000 ${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Wait for container to start
          sleep 10
          
          # Test health endpoint
          curl --fail http://localhost:5000/health || exit 1
          
          # Test home page
          curl --fail http://localhost:5000/ || exit 1
          
          # Cleanup
          docker stop test-container
          docker rm test-container
          
          echo "✅ Container tests passed"

  # ==========================================================================
  # JOB 2: DEPLOY TO AZURE VM
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-test  # Only deploy if build succeeds
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'  # Only deploy on push to main
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Deploy to Azure VM via SSH
      - name: 🚀 Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script: |
            # ============================================================
            # DEPLOYMENT SCRIPT - Runs on Azure VM
            # ============================================================
            
            echo "🚀 Starting deployment at $(date)"
            
            # Define variables
            APP_DIR="/home/${{ secrets.AZURE_VM_USERNAME }}/devops-flask-app"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            # Create app directory if it doesn't exist
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/main
            else
              echo "📥 Cloning repository..."
              git clone $REPO_URL .
            fi
            
            # Navigate to app directory
            cd app
            
            # Stop and remove existing container (if any)
            echo "🛑 Stopping existing container..."
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            
            # Remove old images to free space
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # Build new Docker image
            echo "🐳 Building Docker image..."
            docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest .
            
            # Run new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:5000 \
              -e ENVIRONMENT=production \
              -e APP_VERSION=${{ github.sha }} \
              ${{ env.DOCKER_IMAGE_NAME }}:latest
            
            # Wait for container to start
            sleep 10
            
            # Verify deployment
            echo "🔍 Verifying deployment..."
            if curl --fail http://localhost:${{ env.APP_PORT }}/health; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Deployment verification failed!"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            echo "🎉 Deployment completed at $(date)"

      # Step 3: Deployment notification (optional - prints summary)
      - name: 📝 Deployment Summary
        run: |
          echo "=========================================="
          echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "=========================================="
